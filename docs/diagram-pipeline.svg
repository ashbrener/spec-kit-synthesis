<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The spec-kit-synthesis pipeline: source-typed adapters feed a fragment corpus; the in-session agent extracts, reconciles and composes; a fail-closed verify gate and a deterministic renderer produce an interactive HTML storybook.">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#8f3614"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 z" fill="#a39a86"/></marker>
  </defs>

  <!-- self-drawn card so it reads on both light and dark GitHub backgrounds -->
  <rect x="1" y="1" width="958" height="298" rx="16" fill="#faf7f0" stroke="#d2c9b3" stroke-width="1.5"/>

  <text x="28" y="40" font-size="13" letter-spacing="2.5" fill="#b3471d" font-weight="700">SPEC-KIT-SYNTHESIS — THE PIPELINE</text>
  <line x1="28" y1="52" x2="120" y2="52" stroke="#b3471d" stroke-width="2"/>

  <!-- column labels -->
  <text x="60"  y="86" font-size="11" letter-spacing="1.5" fill="#87827a">SOURCES</text>
  <text x="300" y="86" font-size="11" letter-spacing="1.5" fill="#1f5048">ADAPTERS · CODE</text>
  <text x="560" y="86" font-size="11" letter-spacing="1.5" fill="#b3471d">THE AGENT REASONS</text>
  <text x="820" y="86" font-size="11" letter-spacing="1.5" fill="#6a3a6f">CODE · OUTPUT</text>

  <!-- sources -->
  <g font-size="13" fill="#17150f">
    <rect x="28" y="104" width="150" height="34" rx="8" fill="#f3efe4" stroke="#b3471d"/><text x="46" y="126">specs/</text>
    <rect x="28" y="150" width="150" height="34" rx="8" fill="#f3efe4" stroke="#b3471d"/><text x="46" y="172">code</text>
    <rect x="28" y="196" width="150" height="34" rx="8" fill="#f3efe4" stroke="#b3471d"/><text x="46" y="218">design docs · ADRs</text>
  </g>

  <!-- adapters → corpus -->
  <path d="M178 121 H 232" fill="none" stroke="#a39a86" stroke-width="1.6" marker-end="url(#arg)"/>
  <path d="M178 167 H 232" fill="none" stroke="#a39a86" stroke-width="1.6" marker-end="url(#arg)"/>
  <path d="M178 213 H 232" fill="none" stroke="#a39a86" stroke-width="1.6" marker-end="url(#arg)"/>
  <rect x="234" y="120" width="118" height="94" rx="10" fill="#e2ece7" stroke="#1f5048"/>
  <text x="252" y="160" font-size="13" fill="#17150f">source-typed</text>
  <text x="252" y="180" font-size="13" fill="#17150f">adapters</text>
  <text x="252" y="200" font-size="11" fill="#1f5048">→ fragment corpus</text>

  <!-- corpus node -->
  <path d="M352 167 H 392" fill="none" stroke="#a39a86" stroke-width="1.6" marker-end="url(#arg)"/>
  <rect x="394" y="138" width="96" height="58" rx="10" fill="#ffffff" stroke="#87827a"/>
  <text x="410" y="164" font-size="12" fill="#17150f">fragment</text>
  <text x="410" y="182" font-size="12" fill="#17150f">corpus</text>

  <!-- agent reasoning block -->
  <rect x="510" y="104" width="280" height="126" rx="12" fill="#f6e6da" stroke="#b3471d"/>
  <path d="M490 167 H 510" fill="none" stroke="#8f3614" stroke-width="2" marker-end="url(#ar)"/>
  <g font-size="12" fill="#17150f">
    <rect x="526" y="130" width="74" height="40" rx="8" fill="#faf7f0" stroke="#d2c9b3"/><text x="540" y="154">extract</text>
    <rect x="608" y="130" width="84" height="40" rx="8" fill="#faf7f0" stroke="#b3471d" stroke-width="1.6"/><text x="620" y="149" fill="#b3471d" font-weight="600">reconcile</text><text x="620" y="163" font-size="9" fill="#8f3614">the product</text>
    <rect x="700" y="130" width="76" height="40" rx="8" fill="#faf7f0" stroke="#d2c9b3"/><text x="714" y="154">compose</text>
  </g>
  <path d="M600 150 H 608" fill="none" stroke="#a39a86" stroke-width="1.4" marker-end="url(#arg)"/>
  <path d="M692 150 H 700" fill="none" stroke="#a39a86" stroke-width="1.4" marker-end="url(#arg)"/>
  <text x="526" y="200" font-size="11" fill="#56524a">in-session — merge overlaps · demote superseded → evolution</text>
  <text x="526" y="216" font-size="11" fill="#56524a">notes · surface contradictions as open questions</text>

  <!-- verify gate -->
  <path d="M650 230 V 252" fill="none" stroke="#8f3614" stroke-width="2" marker-end="url(#ar)"/>
  <polygon points="650,252 742,276 650,300 558,276" fill="#e2ece7" stroke="#1f5048"/>
  <text x="650" y="274" font-size="12" fill="#17150f" text-anchor="middle">verify</text>
  <text x="650" y="289" font-size="9.5" fill="#1f5048" text-anchor="middle">fail-closed</text>

  <!-- verify → render → output -->
  <path d="M742 276 H 800" fill="none" stroke="#8f3614" stroke-width="2" marker-end="url(#ar)"/>
  <text x="748" y="270" font-size="9.5" fill="#1f5048">pass</text>
  <rect x="802" y="256" width="76" height="40" rx="8" fill="#faf7f0" stroke="#d2c9b3"/><text x="820" y="280" font-size="12" fill="#17150f">render</text>
  <path d="M840 256 V 234" fill="none" stroke="#8f3614" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="800" y="180" width="138" height="52" rx="10" fill="#efe4f0" stroke="#6a3a6f"/>
  <text x="816" y="206" font-size="12.5" fill="#17150f">interactive</text>
  <text x="816" y="224" font-size="12.5" fill="#17150f">HTML storybook</text>

  <!-- fail loop -->
  <path d="M604 276 H 470 Q 458 276 458 264 L 458 175" fill="none" stroke="#a39a86" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arg)"/>
  <text x="470" y="293" font-size="9.5" fill="#87827a">fail → fix &amp; re-reason</text>
</svg>
